name: Redaction check

# Privacy backstop. Scans the ADDED lines of every PR -- including from
# forks -- for the shapes of private content (emails, absolute home paths,
# credential prefixes).
#
# Uses `pull_request` (not `pull_request_target`) and a read-only token, so
# untrusted fork code never gets repo write access or secrets.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  redaction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: jimy-r/redaction-check-action@c626124f07c3dbf0f89764779ef920cf91f36135 # v1.1.1
        with:
          # github.base_ref is empty on workflow_dispatch, which would leave
          # the manual trigger declared above with nothing to diff against.
          base-ref: ${{ github.base_ref || github.event.repository.default_branch }}
