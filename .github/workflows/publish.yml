name: publish

# PyPI publishing is a deliberate manual act (v0.2.0 shipped as a GitHub release only, 2026-09-13).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      dist-sha256: ${{ steps.digest.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install build
      - run: python -m build
      # `python -m build` executes this repo's own build backend, so the artifact is
      # only as trustworthy as the job that produced it. Carry a digest across the job
      # boundary so publish can prove it got that exact artifact back.
      - id: digest
        run: |
          sha256sum dist/* | sort -k2 > dist.sha256
          echo "sha256<<EOF" >> "$GITHUB_OUTPUT"
          cat dist.sha256 >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          cat dist.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Verify artifact digest matches the build job
        env:
          EXPECTED_SHA256: ${{ needs.build.outputs.dist-sha256 }}
        run: |
          printf '%s\n' "$EXPECTED_SHA256" > expected.sha256
          sha256sum dist/* | sort -k2 > actual.sha256
          if ! diff -u expected.sha256 actual.sha256; then
            echo "::error::dist/ does not match the digest emitted by the build job; refusing to publish"
            exit 1
          fi
          echo "artifact digest verified"
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
